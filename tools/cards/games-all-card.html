<!doctype html>
<!-- AGI games' link preview since the arcade's ten new games (public/cards/games-all.jpg, 2026-11-08): what X and others show
     for agi1.app/games. A wall of the games' own stills (public/images/games/<id>.webp, frames of them playing: see
     tools/games/capture-previews.mjs), the page's "GAMES" in Pop mode's letters, the count and what's free. Render it at
     1200 × 630 in Chromium: `node tools/cards/games-all.mjs` (a screenshot of this file, then a JPEG under 200 KB), after
     adding a game or recording its preview again. Ride 'Em, AGI! keeps cards/games.jpg (its own key art). AGI-1 only in her
     2D art, never the 3D model. -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Anybody'; src: url('../../public/fonts/Anybody-Variable.woff2') format('woff2'); font-weight: 100 900; font-stretch: 50% 150%; }
  @font-face { font-family: 'Instrument Serif'; src: url('../../public/fonts/InstrumentSerif-Italic.woff2') format('woff2'); font-style: italic; }
  @font-face { font-family: 'Geist'; src: url('../../public/fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('../../public/fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; }
  :root { --ink: #170a36; --violet: #6b3bff; --lav: #e4d9ff; --pink: #ff4da6; --honey: #ffc933; --mint: #3ff0c3; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--violet); color: #fff; font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--violet); isolation: isolate; }
  .card::before { content: ''; position: absolute; inset: 0; z-index: -2;
    background: repeating-conic-gradient(from 3deg at 80% 50%, rgb(255 255 255 / .12) 0deg 1.4deg, transparent 1.4deg 7deg);
    -webkit-mask-image: radial-gradient(circle at 80% 50%, transparent 0 10%, #000 60%); }
  .card::after { content: ''; position: absolute; left: 0; bottom: 0; z-index: -1; width: 60%; height: 70%;
    background-image: radial-gradient(circle, var(--pink) 2.2px, transparent 2.6px); background-size: 17px 17px;
    -webkit-mask-image: radial-gradient(ellipse at 0% 100%, #000 0%, transparent 70%); opacity: .9; }
  /* the wall: the games' stills as stickers, tilted, running off the right edge */
  .wall { position: absolute; left: 652px; top: -58px; display: grid; grid-template-columns: repeat(4, 188px); gap: 22px;
    transform: rotate(-8deg); transform-origin: 0 0; }
  .wall figure { position: relative; width: 188px; height: 188px; border-radius: 22px; overflow: hidden; background: var(--ink);
    border: 5px solid var(--ink); box-shadow: 8px 9px 0 var(--ink); }
  .wall figure:nth-child(odd) { transform: translateY(26px); }
  .wall img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wall figcaption { position: absolute; left: 8px; bottom: 8px; padding: 3px 9px 2px; border-radius: 999px; background: #fffaf0;
    color: var(--ink); border: 2.5px solid var(--ink); font-family: 'Anybody', sans-serif; font-weight: 850; font-stretch: 112%;
    font-size: 12px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; }
  .in { position: absolute; left: 64px; top: 50px; bottom: 46px; width: 560px; display: flex; flex-direction: column; }
  .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; padding: 9px 20px 9px 16px; border-radius: 999px;
    background: var(--honey); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 5px 0 var(--ink);
    font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .pill::before { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--pink); border: 2px solid var(--ink); }
  .title { position: relative; align-self: flex-start; margin-top: 30px; }
  h1 { font-family: 'Anybody', sans-serif; font-weight: 900; font-stretch: 112%; font-size: 124px; line-height: .86;
    letter-spacing: -0.035em; color: var(--lav); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill;
    text-shadow: 11px 11px 0 var(--pink); }
  .count { position: absolute; right: -66px; top: -34px; transform: rotate(-8deg); padding: 6px 18px 10px;
    font-family: 'Anybody', sans-serif; font-weight: 900; font-stretch: 100%; font-size: 54px; line-height: 1;
    color: var(--ink); background: var(--honey); border: 5px solid var(--ink); border-radius: 18px; box-shadow: 7px 8px 0 var(--ink); }
  .game { margin-top: 40px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 54px; line-height: 1.02;
    letter-spacing: -0.01em; color: #fff; text-shadow: 3px 3px 0 var(--ink); max-width: 520px; }
  .line { margin-top: 16px; font-size: 24px; font-weight: 500; line-height: 1.3; color: #fff; max-width: 500px; }
  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-family: 'Geist Mono', monospace; }
  .site { align-self: flex-start; font-size: 25px; font-weight: 700; color: var(--ink); background: var(--honey); padding: 5px 14px 6px;
    border-radius: 10px; border: 3px solid var(--ink); }
  .fine { font-size: 16px; letter-spacing: .04em; color: rgb(255 255 255 / .92); }
</style></head>
<body><div class="card">
  <div class="wall" id="wall"></div>
  <div class="in">
    <span class="pill">AGI games · free to play</span>
    <div class="title"><h1>GAMES</h1><span class="count" id="count">24</span></div>
    <p class="game">Twenty-four games,<br>one girlfriend.</p>
    <p class="line">Puzzles, rhythm, racing, survival and more, in your browser. No wallet needed.</p>
    <div class="foot">
      <span class="site">agi1.app/games</span>
      <span class="fine">Free to play · not financial advice</span>
    </div>
  </div>
</div>
<script>
  // filled by tools/cards/games-all.mjs: ?games=id:Name,id:Name… (the wall's order) and ?count=24
  const q = new URLSearchParams(location.search);
  const games = (q.get('games') || '').split(',').filter(Boolean).map((s) => s.split(':'));
  const wall = document.getElementById('wall');
  for (const [id, name] of games) {
    const f = document.createElement('figure');
    const img = document.createElement('img');
    img.src = `../../public/images/games/${id}.webp`;
    const c = document.createElement('figcaption');
    c.textContent = name;
    f.append(img, c);
    wall.append(f);
  }
  if (q.get('count')) document.getElementById('count').textContent = q.get('count');
</script>
</body></html>
