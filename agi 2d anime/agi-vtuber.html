<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agi · live VTuber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1E4F; --ink-2:#5E4F8F; --line:rgba(76,56,150,.16);
  --panel:rgba(255,255,255,.72); --panel-strong:rgba(255,255,255,.92);
  --accent:#7C5CD6; --accent-ink:#fff; --gold:#F1C35F; --live:#FF5D84;
  --chip:rgba(124,92,214,.09); --chip-hover:rgba(124,92,214,.16); --bg:#EFE8FF;
  --shadow:0 14px 34px -16px rgba(58,36,140,.45);
  --font:"M PLUS Rounded 1c","Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F2EDFF; --ink-2:#BDB0EA; --line:rgba(205,190,255,.16);
    --panel:rgba(30,22,60,.68); --panel-strong:rgba(30,22,60,.9);
    --accent:#9D82F2; --chip:rgba(255,255,255,.07); --chip-hover:rgba(255,255,255,.13); --bg:#1A1335;
    --shadow:0 14px 34px -16px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F2EDFF; --ink-2:#BDB0EA; --line:rgba(205,190,255,.16);
  --panel:rgba(30,22,60,.68); --panel-strong:rgba(30,22,60,.9);
  --accent:#9D82F2; --chip:rgba(255,255,255,.07); --chip-hover:rgba(255,255,255,.13); --bg:#1A1335;
  --shadow:0 14px 34px -16px rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;transition:background .5s}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
#stage[data-scene="studio"]{background:
  radial-gradient(40% 34% at 44% 30%,rgba(255,255,255,.95),rgba(255,255,255,0) 72%),
  radial-gradient(60% 18% at 44% 97%,rgba(141,112,214,.22),rgba(141,112,214,0) 70%),
  linear-gradient(180deg,#FBF8FF 0%,#F1E9FF 45%,#E4D8FA 74%,#D9CBF5 100%)}
#stage[data-scene="night"]{background:
  radial-gradient(36% 30% at 44% 32%,rgba(173,146,255,.36),rgba(173,146,255,0) 72%),
  radial-gradient(1.6px 1.6px at 12% 18%,#fff 60%,transparent 64%),radial-gradient(1.2px 1.2px at 27% 9%,#fff 60%,transparent 64%),
  radial-gradient(1.8px 1.8px at 71% 14%,#fff 60%,transparent 64%),radial-gradient(1.2px 1.2px at 84% 27%,#e9e0ff 60%,transparent 64%),
  radial-gradient(1.4px 1.4px at 8% 44%,#e9e0ff 60%,transparent 64%),radial-gradient(1.2px 1.2px at 58% 6%,#fff 60%,transparent 64%),
  radial-gradient(1.6px 1.6px at 92% 52%,#fff 60%,transparent 64%),radial-gradient(1.2px 1.2px at 36% 24%,#e9e0ff 60%,transparent 64%),
  radial-gradient(60% 18% at 44% 97%,rgba(120,90,220,.35),rgba(120,90,220,0) 70%),
  linear-gradient(180deg,#140F30 0%,#231A50 55%,#342771 100%)}
#stage[data-scene="green"]{background:#00B140}

#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px;color:#5E4F8F;background:#F3EDFF;z-index:20;transition:opacity .5s;padding:24px;text-align:center}
#boot.gone{opacity:0;pointer-events:none}
#boot.err{color:#8a1f3d}

/* ---------- top bar ---------- */
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;pointer-events:none;z-index:6}
#top>*{pointer-events:auto}
.ident{display:flex;align-items:center;gap:10px;min-width:0}
.name{font-weight:800;font-size:28px;line-height:1;letter-spacing:.01em;padding:7px 16px 9px;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 -3px 0 var(--gold)}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:8px 13px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:#B7AEDA;transition:background .2s}
.status[data-s="listening"] i{background:var(--gold)}
.status[data-s="speaking"] i{background:var(--live);animation:beat .9s ease-in-out infinite}
.status[data-s="thinking"] i{background:var(--accent);animation:beat 1.3s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.45);opacity:.75}}
.tools{display:flex;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:13px;border:1px solid var(--line);
  background:var(--panel);font-weight:700;font-size:13px;cursor:pointer;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tbtn:hover{background:var(--panel-strong)}
.tbtn svg{width:18px;height:18px;flex:none}
#sheetBtn{display:none}

/* ---------- control panel ---------- */
#panel{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 72px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:304px;
  overflow:auto;overscroll-behavior:contain;padding:18px 16px 20px;background:var(--panel);border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15);box-shadow:var(--shadow);z-index:5}
#panel h2{font-size:14px;font-weight:800;margin:0 0 10px;color:var(--ink)}
#panel section+section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:40px;padding:8px 10px 8px 12px;border-radius:12px;border:1px solid transparent;
  background:var(--chip);font-weight:700;font-size:14px;cursor:pointer;text-align:left;transition:background .15s,transform .15s}
.chip:hover{background:var(--chip-hover)}
.chip:active{transform:scale(.97)}
.chip kbd{font:700 11px/1 var(--font);color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:3px 5px;background:transparent}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] kbd{color:var(--accent-ink);border-color:rgba(255,255,255,.35)}
.chip.pulse{animation:pop .45s ease}
@keyframes pop{35%{transform:scale(.94);background:var(--gold);color:#2A1E4F}}
.chip-wide{grid-column:1/-1}
.hint{font-size:13px;line-height:1.5;color:var(--ink-2);margin:10px 0 0}
.wide{width:100%;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-weight:800;font-size:14px;cursor:pointer}
.wide[aria-pressed="true"]{background:var(--live);color:#fff;border-color:transparent}
.meter{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--live));transform-origin:left;transform:scaleX(0);transition:transform .06s linear}
.range{display:block;margin-top:12px}
.lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.lbl output{font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:26px}
.select{display:block;margin-top:12px}
select{width:100%;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel-strong);padding:0 10px;font-size:14px;font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px;font-weight:700;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:24px;background:var(--chip-hover);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}

/* ---------- talk bar, captions ---------- */
#talk{position:fixed;left:0;right:336px;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:6;pointer-events:none}
#talk>*{pointer-events:auto}
#caption{max-width:min(760px,100%);text-align:center;font-weight:800;font-size:clamp(19px,2.4vw,28px);line-height:1.35;color:#fff;pointer-events:none;
  text-shadow:0 2px 0 #3B2A7C,2px 0 0 #3B2A7C,0 -2px 0 #3B2A7C,-2px 0 0 #3B2A7C,1.6px 1.6px 0 #3B2A7C,-1.6px 1.6px 0 #3B2A7C,1.6px -1.6px 0 #3B2A7C,-1.6px -1.6px 0 #3B2A7C,0 8px 18px rgba(40,20,90,.35);
  opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
#caption.on{opacity:1;transform:none}
#you{align-self:flex-end;max-width:min(420px,80%);margin-right:max(0px,calc((100% - 640px)/2));font-size:14px;font-weight:600;line-height:1.4;padding:9px 14px;border-radius:16px 16px 4px 16px;
  background:var(--accent);color:#fff;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
#you.on{opacity:1;transform:none}
.bar{display:flex;align-items:center;gap:6px;width:min(640px,100%);padding:6px;border-radius:20px;background:var(--panel-strong);border:1px solid var(--line);
  box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.bar:focus-within{box-shadow:0 0 0 3px var(--gold),var(--shadow)}
.mic{width:44px;height:44px;flex:none;border-radius:14px;border:0;background:var(--chip);display:grid;place-items:center;cursor:pointer}
.mic svg{width:21px;height:21px}
.mic[aria-pressed="true"]{background:var(--live);color:#fff}
.modes[hidden]{display:none}.modes{display:flex;flex:none;background:var(--chip);border-radius:12px;padding:3px}
.modes button{border:0;background:transparent;border-radius:9px;height:38px;padding:0 10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink-2)}
.modes button[aria-pressed="true"]{background:var(--panel-strong);color:var(--ink);box-shadow:0 1px 4px rgba(40,20,90,.15)}
.bar input{flex:1;min-width:0;height:44px;border:0;background:transparent;font-size:16px;font-weight:600;padding:0 6px;outline:none}
.bar input::placeholder{color:var(--ink-2);opacity:.8}
.send{flex:none;height:44px;padding:0 18px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;cursor:pointer}
.send.busy{background:var(--ink);color:var(--bg)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-8px);max-width:min(520px,calc(100% - 32px));padding:11px 16px;border-radius:14px;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#unhide{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:9;border:0;border-radius:999px;padding:9px 16px;
  font-weight:800;font-size:13px;background:rgba(30,20,60,.72);color:#fff;cursor:pointer}
#unhide.fade{animation:fadeout 3.2s forwards}
#unhide:hover,#unhide:focus-visible{animation:none;opacity:1}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:0}}
body.clean #top,body.clean #panel,body.clean .bar,body.clean #you{display:none!important}
body.clean #talk{right:0}

/* ---------- small screens: panel becomes a sheet ---------- */
@media (max-width:820px){
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);max-height:min(60vh,560px);
    transform:translateY(calc(100% + 120px));visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
  body.sheet #panel{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  #talk{right:0;padding-left:10px;padding-right:10px}
  #sheetBtn{display:inline-flex}
  .tbtn span{display:none}
  .tbtn{width:42px;padding:0;justify-content:center}
  .name{font-size:22px;padding:6px 12px 8px}
  .modes button{padding:0 8px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage" data-scene="studio"><canvas id="gl" aria-label="Agi, an animated character. Drag across her head to give a head pat."></canvas><canvas id="fx" aria-hidden="true"></canvas></div>
<div id="boot" role="status">Waking Agi up…</div>

<header id="top">
  <div class="ident">
    <span class="name">Agi</span>
    <span class="status" id="status" data-s="idle" role="status"><i aria-hidden="true"></i><span>Idle</span></span>
  </div>
  <div class="tools">
    <button class="tbtn" id="camBtn" type="button" title="Change framing (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="10" r="2.5"/><path d="M8 17c.8-2 2.2-3 4-3s3.2 1 4 3"/></svg><span id="camLabel">Full body</span></button>
    <button class="tbtn" id="sceneBtn" type="button" title="Change backdrop (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg><span id="sceneLabel">Studio</span></button>
    <button class="tbtn" id="hideBtn" type="button" title="Hide controls for screen capture (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.7 3.5M6.6 6.6C3.9 8.3 2.5 12 2.5 12S6 19 12 19a9.6 9.6 0 0 0 4.4-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg><span>Hide controls</span></button>
    <button class="tbtn" id="sheetBtn" type="button" aria-expanded="false" aria-controls="panel" title="Controls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Controls</span></button>
  </div>
</header>

<aside id="panel" aria-label="Controls">
  <section>
    <h2>Expression</h2>
    <div class="chips" id="exprChips"></div>
    <label class="switch">Extra blush<input type="checkbox" id="blushTgl"></label>
  </section>
  <section>
    <h2>Gestures</h2>
    <div class="chips" id="gestChips"></div>
    <p class="hint">Drag across her head for a head pat. Click one of her hands and she waves.</p>
  </section>
  <section>
    <h2>Voice</h2>
    <button class="wide" id="micBtn2" type="button" aria-pressed="false">Use my microphone</button>
    <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
    <label class="range"><span class="lbl">Mic sensitivity <output></output></span><input type="range" id="sens" min="0" max="1" step="0.01"></label>
    <label class="select"><span class="lbl">Speaking voice</span><select id="voiceSel"></select></label>
    <label class="range"><span class="lbl">Pitch <output></output></span><input type="range" id="pitch" min="0.6" max="1.8" step="0.01"></label>
    <label class="range"><span class="lbl">Speed <output></output></span><input type="range" id="rate" min="0.7" max="1.4" step="0.01"></label>
    <label class="switch">Show captions<input type="checkbox" id="capTgl"></label>
  </section>
  <section>
    <h2>Motion</h2>
    <label class="switch">Follow my cursor<input type="checkbox" id="followTgl"></label>
    <label class="range"><span class="lbl">Hair bounce <output></output></span><input type="range" id="hairAmt" min="0" max="1.6" step="0.01"></label>
    <label class="range"><span class="lbl">Breeze <output></output></span><input type="range" id="wind" min="0" max="1" step="0.01"></label>
    <label class="range"><span class="lbl">Body sway <output></output></span><input type="range" id="sway" min="0" max="1.6" step="0.01"></label>
  </section>
</aside>

<div id="talk">
  <div id="you" aria-live="polite"></div>
  <div id="caption" aria-live="polite"></div>
  <div class="bar">
    <button class="mic" id="micBtn" type="button" aria-pressed="false" aria-label="Use my microphone (M)" title="Use my microphone (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <div class="modes" id="modes" role="group" aria-label="What typing does" hidden>
      <button id="modeSay" type="button" aria-pressed="true" title="Agi reads your words aloud">Say</button>
      <button id="modeChat" type="button" aria-pressed="false" title="Agi answers you, powered by Claude" hidden>Chat</button>
    </div>
    <input id="line" type="text" autocomplete="off" enterkeyhint="send" maxlength="1200" placeholder="Type a line for Agi to say" aria-label="Type a line for Agi to say">
    <button class="send" id="send" type="button">Speak</button>
  </div>
</div>
